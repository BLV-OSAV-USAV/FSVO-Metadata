name: I14Y datasets ABN

on:
  # schedule:
  #  - cron: '0 0 * * *'  # Runs every day at midnight
  workflow_dispatch:  # Allows manual triggering

permissions:
  contents: write

jobs:
  harvest-data:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install requests
        
    - name: Get access token
      id: get-token
      env:
        CLIENT_ID: ${{ secrets.CLIENT_ID_ABN}} # client ABN
        CLIENT_SECRET: ${{ secrets.CLIENT_SECRET_ABN}} # secret ABN
      run: |
        python - <<EOF
        import requests
        import os
        import json

        def get_token_without_refresh(client_id,client_secret):
            data = {
                'grant_type': 'client_credentials',
            }
            response = requests.post(
                "https://identity.i14y.a.c.bfs.admin.ch/realms/bfs-sis-a/protocol/openid-connect/token", 
                data=data, 
                verify=False, 
                auth=(client_id,client_secret)
              )

            if response.status_code >= 400:
              raise Exception("Failed to get token")
            return response.json()

        client_id = os.environ['CLIENT_ID']
        client_secret = os.environ['CLIENT_SECRET']

        result = get_token_without_refresh(client_id,client_secret)
        
        access_token = result['access_token']
        print(f"::add-mask::{access_token}")
        with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
            print(f"access_token={access_token}", file=output)
        EOF

    - name: Run harvester script
      env:
        I14Y_ENVIRONMENT: ABN
        ACCESS_TOKEN: ${{ steps.get-token.outputs.access_token }}
      run: python -m i14y.datasets.harvester
    
    - name: Upload log
      uses: actions/upload-artifact@v6
      with:
        name: harvest-log
        path: harvest_log.txt

    - name: Commit and push harvest log
      if: ${{ success() && github.ref_type == 'branch' }}
      run: bash .github/scripts/push-harvest-log.sh harvest_log.txt datasets abn
